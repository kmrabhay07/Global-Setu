services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: globalsetu
      POSTGRES_USER: setu
      POSTGRES_PASSWORD: ${SETU_DB_PASSWORD:?Set a database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setu -d globalsetu"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SETU_DB_URL: jdbc:postgresql://db:5432/globalsetu
      SETU_DB_USER: setu
      SETU_DB_PASSWORD: ${SETU_DB_PASSWORD}
      SETU_ADMIN_MOBILE: ${SETU_ADMIN_MOBILE:?Set administrator mobile}
      SETU_ADMIN_PASSWORD: ${SETU_ADMIN_PASSWORD:?Set administrator password}
      SETU_UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
  uploads:
